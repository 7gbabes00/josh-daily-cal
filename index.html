  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml,body{margin:0;background:#16181a;color:#ece7df;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:#e2775b}a:hover{color:#ece7df}\nbutton:disabled{opacity:.35;cursor:default}\ninput,textarea,button{font:inherit;color:inherit}\n<\u002Fstyle>\n<script src=\"35846d51-58e8-48e4-a0fe-83800d411db2\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#16181a;color:#ece7df;font-family:'Source Sans 3',system-ui,sans-serif;font-size:16px;line-height:1.45\">\n<div style=\"max-width:780px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 80px\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 0 22px\">\n    <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#e2775b\">EXTREME MARTIAL ARTS<\u002Fdiv>\n    <div style=\"display:flex;gap:8px\">\n      <sc-if value=\"{{ canEdit }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ exportData }}\" style=\"min-height:36px;padding:0 12px;border:1px solid #2d3134;border-radius:999px;background:#1e2123;font-size:13px;color:#9b968d;cursor:pointer\">⤓ Export<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasCfg }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ pull }}\" style=\"min-height:36px;padding:0 12px;border:1px solid #2d3134;border-radius:999px;background:#1e2123;font-size:13px;color:#9b968d;cursor:pointer\">↻ Pull<\u002Fbutton>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ openCloud }}\" style=\"min-height:36px;padding:0 12px;border:1px solid {{ chipBorder }};border-radius:999px;background:#1e2123;font-size:13px;color:{{ chipColor }};cursor:pointer;white-space:nowrap\">{{ chipText }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ nudge }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#2a211e;border:1px solid #4a302a;border-radius:10px;padding:10px 12px;margin-bottom:18px;font-size:14px\">\n      <span>Others may have checked things off. Pull the latest?<\u002Fspan>\n      <div style=\"display:flex;gap:8px\">\n        <button sc-camel-on-click=\"{{ pull }}\" style=\"min-height:36px;padding:0 14px;border:0;border-radius:8px;background:#e2775b;color:#16181a;font-weight:700;cursor:pointer\">Pull<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ dismissNudge }}\" style=\"min-height:36px;padding:0 14px;border:1px solid #2d3134;border-radius:8px;background:none;cursor:pointer\">Later<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <h1 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:52px;line-height:1;letter-spacing:-.01em\">{{ title }}<\u002Fh1>\n  <p style=\"margin:10px 0 0;color:#9b968d;text-wrap:pretty\">Do the daily list in order, every day. Set-day items show up on top when they're due.<\u002Fp>\n\n  <div style=\"display:flex;align-items:center;gap:14px;margin:26px 0 8px\">\n    <div style=\"flex:1;height:6px;border-radius:3px;background:#2d3134;overflow:hidden\"><div style=\"height:100%;width:{{ pct }};background:#e2775b;transition:width .3s\"><\u002Fdiv><\u002Fdiv>\n    <span style=\"font-size:14px;color:#9b968d;white-space:nowrap\">{{ doneCount }} of {{ total }} done<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:8px;margin-top:14px\">\n    <button sc-camel-on-click=\"{{ dayPrev }}\" aria-label=\"Previous day\" style=\"flex:none;width:44px;height:44px;border:1px solid #2d3134;border-radius:8px;background:#1e2123;font-size:20px;cursor:pointer\">‹<\u002Fbutton>\n    <la al=\"{{ false }}\"><button sc-camel-on-click=\"{{ c.onEdit }}\" aria-label=\"Edit\" style=\"flex:none;width:48px;min-height:48px;border:0;background:none;color:#9b968d;font-size:17px;cursor:pointer\">✎<\u002Fbutton><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ noCamps }}\" hint-placeholder-val=\"{{ false }}\">\n    <p style=\"margin:14px 0 0;font-size:15px;color:#9b968d\">No camps on the calendar.<\u002Fp>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ canEdit }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ addCal }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:12px;border:1px dashed #3a3f43;border-radius:10px;background:none;color:#9b968d;font-size:15px;font-weight:600;cursor:pointer\">+ Add camp<\u002Fbutton>\n  <\u002Fsc-if>\n\n  <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#9b968d;margin:26px 0 4px\">Tasks during camp season<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column\">\n    <sc-for list=\"{{ campTasks }}\" as=\"t\" hint-placeholder-count=\"1\">\n      <div style=\"display:flex;align-items:center;gap:8px;border-bottom:1px solid #2d3134\">\n        <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:12px 0\">\n          <span style=\"font-weight:700;font-size:17px\">{{ t.text }}<\u002Fspan>\n          <span style=\"font-size:14px;color:#9b968d;text-wrap:pretty\">{{ t.summary }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ t.canEdit }}\" hint-placeholder-val=\"{{ false }}\"><button sc-camel-on-click=\"{{ t.onEdit }}\" aria-label=\"Edit\" style=\"flex:none;width:48px;min-height:48px;border:0;background:none;color:#9b968d;font-size:17px;cursor:pointer\">✎<\u002Fbutton><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ canEdit }}\" hint-placehold ;margin-top:9px;border-radius:50%;border:1px solid currentColor;background:{{ l.dot }}\"><\u002Fspan><span><sc-for list=\"{{ l.parts }}\" as=\"p\" hint-placeholder-count=\"1\"><span style=\"font-weight:{{ p.w }}\">{{ p.t }}<\u002Fspan><\u002Fsc-for><\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <sc-if value=\"{{ canEdit }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ addAi }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:12px;border:1px dashed #3a3f43;border-radius:10px;background:none;color:#9b968d;font-size:15px;font-weight:600;cursor:pointer\">+ Add AI section<\u002Fbutton>\n  <\u002Fsc-if>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{ dlgCloud }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeDlg }}\" style=\"position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:#1e2123;border:1px solid #2d3134;border-radius:16px 16px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom))\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n        <h2 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;text-transform:uppercase\">Cloud sync<\u002Fh2>\n        <button sc-camel-on-click=\"{{ closeDlg }}\" style=\"width:44px;height:44px;border:0;background:none;color:#9b968d;font-size:18px;cursor:pointer;margin-right:-10px\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ noCfg }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <p style=\"margin:0;font-size:14px;color:#9b968d;line-height:1.5\">Paste a GitHub token with the <b style=\"color:#ece7df\">gist<\u002Fb> permission. First device: <b style=\"color:#ece7df\">Create new Gist<\u002Fb>. Every other device: paste the same token and the Gist ID, then <b style=\"color:#ece7df\">Connect<\u002Fb>.<\u002Fp>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\">GitHub token<input type=\"password\" value=\"{{ form.token }}\" sc-camel-on-change=\"{{ onToken }}\" placeholder=\"ghp_…\" sc-camel-auto-complete=\"off\" style=\"min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\"><span>Gist ID <span style=\"color:#9b968d;font-weight:400\">(leave empty to create one)<\u002Fspan><\u002Fspan><input value=\"{{ form.gistId }}\" sc-camel-on-change=\"{{ onGist }}\" placeholder=\"e.g. 3f9a…\" sc-camel-auto-complete=\"off\" style=\"min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400\"><\u002Flabel>\n          <button sc-camel-on-click=\"{{ primaryAction }}\" disabled=\"{{ primaryDisabled }}\" style=\"min-height:48px;padding:0 18px;border:0;border-radius:8px;background:#e2775b;color:#16181a;font-weight:700;cursor:pointer\">{{ primaryLabel }}<\u002Fbutton>\n          <div style=\"display:flex;flex-direction:column;gap:14px;border-top:1px solid #2d3134;padding-top:14px\">\n            <div style=\"font-size:13px;font-weight:600\">Helper? Join with a passcode<\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\">Share link<input value=\"{{ form.worker }}\" sc-camel-on-change=\"{{ onWorker }}\" placeholder=\"https://….workers.dev\" sc-camel-auto-complete=\"off\" style=\"min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\">Passcode<input type=\"password\" value=\"{{ form.pass }}\" sc-camel-on-change=\"{{ onPass }}\" sc-camel-auto-complete=\"off\" style=\"min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400\"><\u002Flabel>\n            <button sc-camel-on-click=\"{{ joinAction }}\" disabled=\"{{ joinDisabled }}\" style=\"min-height:48px;padding:0 18px;border:1px solid #e2775b;border-radius:8px;background:none;color:#e2775b;font-weight:700;cursor:pointer\">{{ joinLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasCfg }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:14px;font-weight:600;color:{{ statusColor }}\">{{ statusLine }}<\u002Fdiv>\n          <sc-if value=\"{{ gistId }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\">Gist ID\n            <div style=\"display:flex;gap:8px\"><input sc-camel-read-only=\"{{ true }}\" value=\"{{ gistId }}\" style=\"flex:1;min-width:0;min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-weight:400\"><button sc-camel-on-click=\"{{ copyId }}\" style=\"min-height:44px;padding:0 14px;border:1px solid #2d3134;border-radius:8px;background:none;cursor:pointer\">{{ copyIdLabel }}<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;color:#9b968d;line-height:1.5\">Every device must use this same Gist ID. If two devices say “synced” but don't update each other, their Gist IDs don't match.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isHelper }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;font-size:13px;color:#9b968d;line-height:1.5\">Connected with a passcode. Your check-offs sync to the shared checklist.<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ pull }}\" style=\"min-height:44px;padding:0 14px;border:1px solid #2d3134;border-radius:8px;background:none;cursor:pointer\">↻ Pull latest<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ openHistory }}\" style=\"min-height:44px;padding:0 14px;border:1px solid #2d3134;border-radius:8px;background:none;cursor:pointer\">Recover from history<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ snap }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px;border:1px solid #2d3134;border-radius:10px;padding:12px;background:#16181a\">\n              <div style=\"font-size:13px;font-weight:600\">Live snapshot link<\u002Fdiv>\n              <p style=\"margin:0;font-size:13px;color:#9b968d;line-height:1.5\">A read-only page of the checklist that updates itself. Anyone with the link can view it; no one can edit it.<\u002Fp>\n              <div style=\"display:flex;gap:8px\"><input sc-camel-read-only=\"{{ true }}\" value=\"{{ snap }}\" style=\"flex:1;min-width:0;min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#1e2123\"><button sc-camel-on-click=\"{{ copySnap }}\" style=\"min-height:44px;padding:0 14px;border:1px solid #2d3134;border-radius:8px;background:none;cursor:pointer\">{{ copySnapLabel }}<\u002Fbutton><a href=\"{{ snap }}\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid #2d3134;border-radius:8px;text-decoration:none;color:#ece7df\">Open<\u002Fa><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ disconnect }}\" style=\"min-height:44px;padding:0 14px;border:1px solid #2d3134;border-radius:8px;background:none;color:#e2775b;cursor:pointer\">Disconnect this device<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ msg }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:12px 0 0;font-size:14px;color:#e2775b\">{{ msg }}<\u002Fp><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ dlgEdit }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeDlg }}\" style=\"position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:#1e2123;border:1px solid #2d3134;border-radius:16px 16px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom))\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n        <h2 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;text-transform:uppercase\">{{ edTitle }}<\u002Fh2>\n        <button sc-camel-on-click=\"{{ closeDlg }}\" style=\"width:44px;height:44px;border:0;background:none;color:#9b968d;font-size:18px;cursor:pointer;margin-right:-10px\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\">{{ edNameLabel }}<input value=\"{{ ed.text }}\" sc-camel-on-change=\"{{ edOnText }}\" sc-camel-auto-complete=\"off\" style=\"min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400;color-scheme:dark\"><\u002Flabel>\n        <sc-if value=\"{{ edShowNotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\">Notes<textarea value=\"{{ ed.notes }}\" sc-camel-on-change=\"{{ ay of the month<input type=\"number\" min=\"1\" max=\"31\" value=\"{{ ed.dom }}\" sc-camel-on-change=\"{{ edOnDom }}\" style=\"min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400;color-scheme:dark\"><\u002Flabel>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ edIsMnth }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\">Which one\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n                <sc-raw-select value=\"{{ ed.nthN }}\" sc-camel-on-change=\"{{ edOnNthN }}\" style=\"min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400;color-scheme:dark\"><option value=\"1\">1st<\u002Foption><option value=\"2\">2nd<\u002Foption><option value=\"3\">3rd<\u002Foption><option value=\"4\">4th<\u002Foption><option value=\"5\">5th<\u002Foption><\u002Fsc-raw-select>\n                <sc-raw-select value=\"{{ ed.nthD }}\" sc-camel-on-change=\"{{ edOnNthD }}\" style=\"min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400;color-scheme:dark\"><option value=\"0\">Sunday<\u002Foption><option value=\"1\">Monday<\u002Foption><option value=\"2\">Tuesday<\u002Foption><option value=\"3\">Wednesday<\u002Foption><option value=\"4\">Thursday<\u002Foption><option value=\"5\">Friday<\u002Foption><option value=\"6\">Saturday<\u002Foption><\u002Fsc-raw-select>\n                <span style=\"font-weight:400;color:#9b968d\">of each month<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ edIsOnce }}\" hint-placeholder-val=\"{{ false }}\">\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\">Date<input type=\"date\" value=\"{{ ed.once }}\" sc -height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400;color-scheme:dark\">\n                <button sc-camel-on-click=\"{{ r.onRemove }}\" aria-label=\"Remove dates\" style=\"flex:none;width:44px;height:44px;border:0;background:none;color:#9b968d;font-size:16px;cursor:pointer\">✕<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <button sc-camel-on-click=\"{{ edAddRange }}\" style=\"align-self:flex-start;min-height:44px;padding:0 14px;border:1px solid #2d3134;border-radius:8px;background:none;font-weight:600;cursor:pointer\">+ Add more dates<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:13px;color:#9b968d;line-height:1.5\">Weekends are skipped. For a break with a gap (like Winter Break), add a second row of dates. For a one-day camp, use the same date twice.<\u002Fp>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\"><span>Tasks start <span style=\"color:#9b968d;font-weight:400\">(optional)<\u002Fspan><\u002Fspan><input type=\"date\" value=\"{{ ed.tasksFrom }}\" sc-camel-on-change=\"{{ edOnTasksFrom }}\" style=\"min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400;color-scheme:dark\"><\u002Flabel>\n          <p style=\"margin:0;font-size:13px;color:#9b968d;line-height:1.5\">Leave empty to start 2 weeks before the first day.<\u002Fp>\n          <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600\"><span>Note <span style=\"color:#9b968d;font-weight:400\">(optional)<\u002Fspan><\u002Fspan><input value=\"{{ ed.note }}\" sc-camel-on-change=\"{{ edOnNote }}\" placeholder=\"e.g. ½ days, end date TBD\" sc-camel-auto-complete=\"off\" style=\"min-height:44px;padding:0 12px;border:1px solid #2d3134;border-radius:8px;background:#16181a;font-size:15px;font-weight:400;color-scheme:dark\"><\u002Flabel>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ edIsAi }}\" hint-placeholder-val=\"{{ false }}\">\n          <label style=\"display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ ed.muted }}\" sc-camel-on-change=\"{{ edOnMuted }}\" style=\"width:22px;height:22px;accent-color:#e2775b\">Not active yet (shows in grey)<\u002Flabel>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ msg }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:14px;color:#e2775b\">{{ msg }}<\u002Fp><\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ edSave }}\" style=\"min-height:48px;padding:0 18px;border:0;border-radius:8px;background:#e2775b;color:#16181a;font-weight:700;cursor:pointer\">Save<\u002Fbutton>\n        <sc-if value=\"{{ edCanMove }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:8px\">\n            <button sc-camel-on-click=\"{{ edUp }}\" disabled=\"{{ edNoUp }}\" style=\"flex:1;min-height:44px;border:1px solid #2d3134;border-radius:8px;background:none;font-weight:600;cursor:pointer\">↑ Move up<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ edDown }}\" disabled=\"{{ edNoDown }}\" style=\"flex:1;min-height:44px;border:1px solid #2d3134;border-radius:8px;background:none;font-weight:600;cursor:pointer\">↓ Move down<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ edExisting }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ edDelete }}\" style=\"min-height:44px;padding:0 14px;border:1px solid #2d3134;border-radius:8px;background:none;color:#e2775b;font-weight:600;cursor:pointer\">Delete<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ dlgHistory }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeDlg }}\" style=\"position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:#1e2123;border:1px solid #2d3134;border-radius:16px 16px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom))\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n        <h2 style=\"margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;text-transform:uppercase\">{{ histTitle }}<\u002Fh2>\n        <button sc-camel-on-click=\"{{ histBack }}\" style=\"width:44px;height:44px;border:0;background:none;color:#9b968d;font-size:18px;cursor:pointer;margin-right:-10px\">{{ histBackIcon }}<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ histHelp }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"margin:0 0 12px;font-size:14px;color:#9b968d\">{{ histHelp }}<\u002Fp><\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;border:1px solid #2d3134;border-radius:10px;overflow:hidden\">\n        <sc-for list=\"{{ histRows }}\" as=\"h\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ h.onClick }}\" style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:8px 14px;border:0;border-bottom:1px solid #2d3134;background:none;text-align:left;cursor:pointer;font-size:15px\"><span>{{ h.text }}<\u002Fspan><span style=\"font-size:13px;color:{{ h.sideColor }}\">{{ h.side }}<\u002Fspan><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ canRestore }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ restoreMissing }}\" style=\"width:100%;margin-top:14px;min-height:48px;border:0;border-radius:8px;background:#e2775b;color:#16181a;font-weight:700;cursor:pointer\">{{ restoreLabel }}<\u002Fbutton>\n      <\u002Fsc-if>\n      <p style=\"margin:12px 0 0;font-size:13px;color:#9b968d\">Restoring only adds items back. Nothing in your current list is removed.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;collapseDone&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;referenceOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nconst ACC = '#e2775b', INK = '#ece7df', BODY = '#d9d4cc', MUTE = '#9b968d';\nconst SEED_AT = '2026-01-01T00:00:00.000Z';\nconst SEED_PREFIX = 's4_';\nconst GROUPS = [\n  { k: 'daily', label: 'Every day, in order' },\n  { k: 'mon', label: 'Monday' },\n  { k: 'fri', label: 'Friday' },\n  { k: 'month', label: 'Once a month' },\n  { k: 'camp', label: 'Camps' },\n  { k: 'once', label: 'One time' },\n  { k: 'cal', label: 'Camp dates' },\n  { k: 'ai', label: 'AI Agent Tasks' }\n];\nconst GL = Object.fromEntries(GROUPS.map(g => [g.k, g.label]));\n// [title, notes, extras]  extras: label, days (weekdays due, 0=Sun), dom (day of month due), pricing\nconst SEED = {\n  daily: [\n    ['Check Hive', ['Read & respond to all new messages and notifications.']],\n    ['Check the phone', ['Listen to & respond to all voicemails and texts.']],\n    ['Check Rainmaker texts', ['Check and respond to all Rainmaker texts (if any texts are for Chief, send him a quick text).']],\n    ['Go through the intro lesson list', [\"Any day of appointment that hasn't confirmed gets a call.\"]],\n    ['Work your task list in Hive', [\"Work through every task that's due today.\", 'For anything you have to do later, however small, set a Task Set Follow Up with a date and notes. All tasks should live in Hive.']],\n    ['Past dues', ['Check the auto-collect reports under Reports, AutoCollect then Tuition Past Due Detail.', 'If a payment failed, message them in Hive:', \"> Hey, this is [name] with Extreme Martial Arts. [Student]'s tuition didn't process. Please let me know if we can run this payment. Thank you.\", \"Weekly payers: warn them first that they also have a Friday payment coming, so you'd be charging twice. Get their OK before you re-run it.\", 'If they give you a date (\"can\\'t pay until Wednesday\"), stop texting until that date. Set a Task Set Follow Up in Hive for this.', 'After 7 texts or calls with no fix, take them off billing and move them to \"Removed from Billing\" in Hive. Then in Hive move them to TSF Schedule/Injury/Money and make a note that they are past due (don\\'t forget the note).', '! Goal: keep past dues under about $500 a month.']],\n    ['Check quits and pauses', [\"If you were unable to save the student, take care of the final payment and close the account. If their final payment is in the future, set a Task Set Follow Up to check the payment 2 days after the payment day, so you know for sure the payment went through. If it did, close the account. If it didn't, first try to run the payment yourself, and break it up into smaller payments to see if it goes through then. If it still doesn't go through, contact them to get it paid.\", \"! If the last payment runs today, don't cancel today. Payments sometimes bounce back. A Friday payment waits until Monday.\", 'Remove them from the rosters and update the active-members spreadsheet. If Kickboxing, let Coach Zeke know to remove them off his roster with a quick text.', \"Check return dates for paused members. Text them before they come off pause to confirm they're coming back and billing starts again.\"]],\n    ['Add new students to the rosters', ['Add them to the rosters in Hive and Rainmaker, and to the paper roster.']],\n    ['Student texts: MIA, Good Job and Goals', [\"MIA: text students who've stopped showing up.\", 'Good Job: text after a great class, a stripe or a belt.', \"Goals: check in on what they're working toward.\", 'Support Text: text them to see how we can support their kiddo on the mat based on what they are working on at home.']],\n    ['Enrollments', ['Did you ask for a review for a discount?', 'Convert to Member in Rainmaker, go over the agreement and fix the profile.', 'Profile fields: Source, State, Age Group, Rank System, Rank Size, MA Style = White Belt, and style tags.', 'Payments: down payment, the right dates and frequency, all future payments added, family members linked.', 'Hand out the free PNO, the Seminar Pass and the VIP Pass, and record their referrals.', 'Log intro notes in Hive.'], { pricing: true }],\n    ['Accountability', ['You have to hold not only a high standard but be willing to accurately self reflect and be honest with yourself about what is actually there and what you find.']]\n  ],\n  mon: [\n    ['Assistant schedule', ['Build it Monday.', '! It must go out by end of day Tuesday.'], { label: 'Monday · due Tuesday', days: [1, 2] }],\n    ['Assistants', ['Train them and keep them sharp on the mat.'], { label: 'Monday · 4pm', days: [1] }]\n  ],\n  fri: [\n    ['Weekly numbers', ['New leads (by source)', 'Appointments booked', 'Intros run', 'Enrollments', 'Attendance', 'Active members', 'Past dues', 'Revenue'], { days: [5] }],\n    ['BJJ curriculum to Chief', [\"Prep next week's curriculum and tell Chief what it is.\"], { days: [5] }]\n  ],\n  month: [\n    ['Assistant payroll', ['Run payroll for the assistants, right and on time.'], { label: 'Once a month · 21st', dom: 21 }],\n    ['Marketing and events', ['Plan every event a year ahead, on both the Google calendar and the paper calendar.', 'Each plan covers: description, date and cost, supplies, staffing, setup time, what students need to bring, and progress deadlines.', 'Timeline, working back from the event date:', '- Plan locked: about 8 weeks out', '- Flyer and sign-up sheet to Chief: about 6 weeks out', '- Promo starts: 3–6 weeks out', '- Staff and supplies confirmed: 1 week out', '- Week of: 2–3+ emails, 2–3+ texts and daily social posts', \"Flyers go on the whiteboard, the lobby TV, the bathroom and the front counter. Ask students which event they're coming to, not if.\", 'Custom gear needs about 14+ weeks from design to in-hand: design due 3 days before ordering samples, samples about 6 weeks, pre-orders about 2 weeks, order placed 6 weeks before in-hand.', 'After each event: send a thank-you and note what worked.', 'Send email newsletters through Rainmaker in the \"value sandwich\" format: something useful first, the ask in the middle, a warm close.'], { label: '4th Friday of each month', nth: [4, 5] }],\n    ['Stock count day', ['Count office supplies, bathroom supplies and merch/gear at both the dojo and 307. Text Chief to see if anything needs to be ordered or if it is on auto-ship.', 'Waters, Gatorades, Staff Snacks, Coffee Cups, Bathroom Hand Towels, Trash Bags and Toilet Paper are ALL ON AUTO-SHIP. Do not buy. Let Chief know if we need something sooner, AND let him know if we need to add something we use regularly to the auto-ship.', 'Build the gear order from the count. Send it to Chief before ordering.', 'Budget: about $100 covers consumables for 3–4 months (1.5–2 months during camp). (These are on Auto-Ship so let Chief know if we run out sooner.)', 'Email every receipt to Sarah as you go.', \"Update the stock list when you're done.\"], { label: '2nd Friday of each month', nth: [2, 5] }]\n  ],\n  camp: [['Update the summer camp list', ['Answer calls from parents asking about camp.', 'Check the email for new registrations.', 'Check waivers.', 'Add new campers to the Master List, the Current Week list and the AI spreadsheet (so invoices run).']]],\n  cal: [\n    ['Fall Break', [], { ranges: [['2026-10-12', '2026-10-12']] }],\n    ['Thanksgiving Week', [], { ranges: [['2026-11-23', '2026-11-25']] }],\n    ['Winter Break', [], { ranges: [['2026-12-21', '2026-12-23'], ['2026-12-28', '2026-12-30']], note: 'Dec 28–30 are ½ days' }],\n    ['Staff
